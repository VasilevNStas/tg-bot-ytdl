[project]
name = "tg-bot-ytdl"
version = "0.1.0"
description = "Telegram bot for downloading YouTube video and audio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "VasilevNStas", email = "ctac@outlook.com" }]
keywords = ["telegram", "bot", "youtube", "yt-dlp", "aiogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiogram>=3.13,<4",
    "yt-dlp>=2024.12.13",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bot_ytdl"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
