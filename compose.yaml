name: tg-bot-ytdl

services:
  bot:
    image: ghcr.io/vasilevnstas/tg-bot-ytdl:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
